name: Build VST3

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-vst3:
    name: Windows (VST3)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure (CMake + JUCE via FetchContent)
        # Sem -G: usa o gerador Visual Studio disponível na imagem (x64).
        # -DSATURAIR_BUILD_TESTS=ON: compila a suíte Catch2 em Tests/.
        run: cmake -B build -A x64 -DSATURAIR_BUILD_TESTS=ON

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Testes unitários (ctest + Catch2)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validação pluginval (strictness 10)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive -Path pluginval.zip -DestinationPath pluginval -Force
          & "pluginval\pluginval.exe" --strictness-level 10 --verbose --validate "build\SaturAir_artefacts\Release\VST3\SaturAir.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SaturAir-Windows-VST3
          path: build/SaturAir_artefacts/Release/VST3/
          if-no-files-found: error

  # Publica uma Release automaticamente quando o push e uma tag v*.
  # Uso:  git tag v0.2.0 && git push origin v0.2.0
  release:
    name: Publica Release
    needs: windows-vst3
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write   # libera o GITHUB_TOKEN para criar release + anexar asset
    steps:
      - name: Baixa o artifact (build ja pronto, sem recompilar)
        uses: actions/download-artifact@v4
        with:
          name: SaturAir-Windows-VST3
          path: release-tmp

      - name: Zipa so o bundle (exclui .exp/.lib)
        shell: pwsh
        run: Compress-Archive -Path "release-tmp\SaturAir.vst3" -DestinationPath "SaturAir-VST3-win64.zip" -Force

      - name: Cria a Release com o zip anexado
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "SaturAir-VST3-win64.zip" `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "SaturAir $env:GITHUB_REF_NAME" `
            --notes "Build Windows x64 (VST3) - CI: GitHub Actions / MSVC Release. Extraia e copie a pasta ``SaturAir.vst3`` para ``C:\Program Files\Common Files\VST3``."

  # Adicione depois, se quiser macOS/AU:
